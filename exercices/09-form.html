<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exercice n°9 - Le formulaire</title>
    <link href="../dist/style.css"
          rel="stylesheet">
</head>
<body class="bg-slate-100">
<main class="flex min-h-screen items-center justify-center p-6">
    <form class="w-full max-w-md space-y-5 rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
        <h1 class="text-2xl font-bold">Nous contacter</h1>
        <div>
            <label for="name" class="block text-sm font-medium text-slate-700">Nom</label>
            <input id="name" name="name" type="text" placeholder="John Doe" required
                   class="mt-1 block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 placeholder:text-slate-400 focus:border-blue-600 focus:ring-2 focus:ring-blue-600/30 focus:outline-none invalid:not-placeholder-shown:border-red-500 invalid:not-placeholder-shown:text-red-600"/>
        </div>
        <div>
            <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
            <input id="email" name="email" type="email" placeholder="john@example.com" required
                   class="mt-1 block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 placeholder:text-slate-400 focus:border-blue-600 focus:ring-2 focus:ring-blue-600/30 focus:outline-none invalid:not-placeholder-shown:border-red-500 invalid:not-placeholder-shown:text-red-600"/>
        </div>
        <div>
            <label for="subject" class="block text-sm font-medium text-slate-700">Sujet</label>
            <select id="subject" name="subject" class="mt-1 block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 placeholder:text-slate-400 focus:border-blue-600 focus:ring-2 focus:ring-blue-600/30 focus:outline-none">
                <option>Question générale</option>
                <option>Support</option>
                <option>Partenariat</option>
            </select>
        </div>
        <div>
            <label for="message" class="block text-sm font-medium text-slate-700">Message</label>
            <textarea id="message" name="message" rows="4" class="mt-1 block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 placeholder:text-slate-400 focus:border-blue-600 focus:ring-2 focus:ring-blue-600/30 focus:outline-none"></textarea>
        </div>
        <label class="flex items-center gap-2 text-sm text-slate-700">
            <input type="checkbox" class="size-4 rounded border-slate-300 accent-blue-600"/>
            J'accepte d'être recontacté
        </label>
        <button type="submit" class="w-full rounded-lg bg-slate-800 px-6 py-3 font-bold text-white transition hover:bg-slate-900 focus-visible:ring-4 focus-visible:ring-slate-400 focus-visible:outline-none active:scale-[0.99]">
            Envoyer
        </button>
    </form>
</main>
</body>
</html>
